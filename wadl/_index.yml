prior_record_note: 'Before this pass the repository held openapi/_original/elsevier-openapi.yml — an eight-operation
  OpenAPI 3.1.0 titled ''Elsevier Scopus APIs'' whose description begins ''Subset of the Elsevier Developer
  (api.elsevier.com) Scopus APIs...''. No document of that shape is served anywhere on an Elsevier host:
  /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs and /docs all 404 on api.elsevier.com
  and dev.elsevier.com (probed 2026-09-06). provenance.yml nonetheless records it as ''harvested — fetched
  from the provider as-is; byte-identical to the source'', which the manifest builder infers from the
  _original/ directory rather than from evidence. Treat that file as a stand-in of unverified authorship;
  the contracts in this directory and the seven Swagger 2.0 documents in openapi/ are the ones actually
  served by Elsevier, and they cover 98 unique operations rather than 8.'
