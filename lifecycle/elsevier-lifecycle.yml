sla:
  published: false
  detail: >-
    The API Service Agreement (dev.elsevier.com/api_service_agreement.html) governs permitted
    use, not availability. No uptime commitment, no credit schedule, no support response target
    is published for the free non-commercial tier.
support:
  channel: case queue
  url: https://service.elsevier.com/app/contact/supporthub/researchproductsapis/
  detail: >-
    A single contact form is the channel for quota increases, access-controlled API enablement,
    Institutional Tokens, commercial licensing and incidents. There is no forum, no public
    issue tracker, and the one first-party SDK repository is archived and read-only.
