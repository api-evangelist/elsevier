note: >-
  Elsevier serves exactly one well-known document, and it is not one of the usual five.
  https://www.elsevier.com/.well-known/tdmrep.json is a TDM Reservation Protocol (W3C TDM
  Reservation Protocol CG) manifest that reserves text-and-data-mining rights over the whole
  site and points at an ODRL offer at https://www.elsevier.com/tdm/tdmrep-policy.json. The
  same reservation is echoed at runtime by the API itself: every api.elsevier.com response
  carries `tdm-reservation: 1` and `tdm-policy: https://www.elsevier.com/tdm/tdmrep-policy.json`
  response headers (observed on a live 401 from /content/search/scopus). No security.txt,
  no OpenID/OAuth discovery, no api-catalog, no ai-plugin, no agent card on any host.
hosts:
- host: www.elsevier.com
  documents:
  - path: /.well-known/tdmrep.json
    status: 200
    content_type: application/json
    file: elsevier-tdmrep.json
    note: TDM Reservation Protocol manifest; tdm-reservation 1 for location "/".
  - path: /tdm/tdmrep-policy.json
    status: 200
    content_type: application/json
    file: elsevier-tdmrep-policy.json
    note: >-
      Not a /.well-known/ path — it is the ODRL policy the tdmrep manifest points at, saved
      because the manifest is meaningless without it. Assigner Elsevier B.V., contact
      tdm-license@elsevier.com; permits tdm:mine for EU DSM Article 3 research purposes and
      attaches a duty for every other purpose.
