openapi: 3.2.0
info:
  title: Elsevier SciVal SciVal Topic Lookup API
  version: 3.0.1
servers:
- url: https://api.elsevier.com/analytics/scival
tags:
- name: SciVal Topic Lookup API
paths:
  /topic/countryId/{countryId}:
    get:
      parameters:
      - description: SciVal country id of requested topics
        in: path
        name: countryId
        required: true
        x-example: 4
        schema:
          type: integer
          format: int64
      - description: Year range of returned topics
        in: query
        name: yearRange
        schema:
          type: string
          enum:
          - 3yrs
          - 3yrsAndCurrent
          - 3yrsAndCurrentAndFuture
          - 5yrs
          - 5yrsAndCurrent
          - 5yrsAndCurrentAndFuture
          - 10yrs
          default: 5yrs
      - description: The number of topics to return
        in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 100
      - description: For paginating results, this is how many pages of topics to skip before returning results
        in: query
        name: offset
        schema:
          type: integer
          format: int32
          default: 0
      - description: Your API key
        in: query
        name: apiKey
        required: true
        schema:
          type: string
          default: 7f59af901d2d86f78a1fd60c1bf9426a
      - description: Specification for authorization, institution authtoken
        in: query
        name: insttoken
        required: false
        schema:
          type: string
      - description: Specification for active session, secured authtoken
        in: query
        name: access_token
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
            application/vnd.scival.v2+json:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
            application/vnd.scival.v2+xml:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
        '400':
          description: The offset for this request must be greater than zero
        '401':
          description: Request not authorized
        '500':
          description: Unknown error encountered
      tags:
      - SciVal Topic Lookup API
      description: sorted by the country's scholarly output in descending order
      operationId: getTopicsByCountryId
      summary: Get topics by SciVal country id
  /topic/institutionId/{institutionId}:
    get:
      parameters:
      - description: SciVal institution id of requested topics
        in: path
        name: institutionId
        required: true
        x-example: 508175
        schema:
          type: integer
          format: int64
      - description: Year range of returned topics
        in: query
        name: yearRange
        schema:
          type: string
          enum:
          - 3yrs
          - 3yrsAndCurrent
          - 3yrsAndCurrentAndFuture
          - 5yrs
          - 5yrsAndCurrent
          - 5yrsAndCurrentAndFuture
          - 10yrs
          default: 5yrs
      - description: Whether to return key contributing topics only
        in: query
        name: keyContribOnly
        schema:
          type: boolean
          default: false
      - description: The number of topics to return
        in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 100
      - description: For paginating results, this is how many pages of topics to skip before returning results
        in: query
        name: offset
        schema:
          type: integer
          format: int32
          default: 0
      - description: Your API key
        in: query
        name: apiKey
        required: true
        schema:
          type: string
          default: 7f59af901d2d86f78a1fd60c1bf9426a
      - description: Specification for authorization, institution authtoken
        in: query
        name: insttoken
        required: false
        schema:
          type: string
      - description: Specification for active session, secured authtoken
        in: query
        name: access_token
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
            application/vnd.scival.v2+json:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
            application/vnd.scival.v2+xml:
              schema:
                $ref: '#/components/schemas/TopicsResponse'
        '400':
          description: The offset for this request must be greater than zero
        '401':
          description: Request not authorized
        '500':
          description: Unknown error encountered
      tags:
      - SciVal Topic Lookup API
      description: sorted by the institution's scholarly output in descending order
      operationId: getTopicsByInstitutionId
      summary: Get topics by SciVal institution id
  /topic/metrics:
    get:
      parameters:
      - description: Types of the desired metrics
        in: query
        name: metricTypes
        required: true
        schema:
          type: string
          enum:
          - AuthorCount
          - CitationCount
          - CitingPatentCount
          - CorePapers
          - FieldWeightedCitationImpact
          - InstitutionCount
          - PatentCitationCount
          - PatentCitationsPerPublication
          - PatentCitedPublicationCount
          - ProminencePercentile
          - MostRecentlyPublishedPapers
          - RelatedTopics
          - ScholarlyOutput
          - TopAuthors
          - TopCitedPublications
          - TopInstitutions
          - TopJournals
          - TopKeywords
      - description: Topic ids to return metrics for
        in: query
        name: topicIds
        required: true
        schema:
          type: string
          default: '17340'
      - description: Year range of returned metric (see response values for metricStartYear and metricEndYear for actual years)
        in: query
        name: yearRange
        schema:
          type: string
          enum:
          - 3yrs
          - 3yrsAndCurrent
          - 3yrsAndCurrentAndFuture
          - 5yrs
          - 5yrsAndCurrent
          - 5yrsAndCurrentAndFuture
          - 10yrs
          default: 5yrs
      - description: The URI(s) of the subject area(s) to filter the returned metrics by. Provide multiple URIs as a comma-separated list; results use OR logic (a publication matches if it belongs to any selected subject area).
        in: query
        name: subjectAreaFilterURI
        schema:
          type: string
          default: ''
      - description: Whether to include self-cited documents (not applicable to all metrics)
        in: query
        name: includeSelfCitations
        schema:
          type: boolean
          default: true
      - description: Whether to return results broken down by year (not applicable to all metrics)
        in: query
        name: byYear
        schema:
          type: boolean
          default: false
      - description: Publication types to include (not applicable to all metrics)
        in: query
        name: includedDocs
        schema:
          type: string
          enum:
          - AllPublicationTypes
          - ArticlesOnly
          - ArticlesReviews
          - ArticlesReviewsConferencePapers
          - ArticlesReviewsConferencePapersBooksAndBookChapters
          - ArticlesConferencePapers
          - BooksAndBookChapters
          default: AllPublicationTypes
      - description: Your API key
        in: query
        name: apiKey
        required: true
        schema:
          type: string
          default: 7f59af901d2d86f78a1fd60c1bf9426a
      - description: Specification for authorization, institution authtoken
        in: query
        name: insttoken
        required: false
        schema:
          type: string
      - description: Specification for active session, secured authtoken
        in: query
        name: access_token
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
            application/vnd.scival.v2+json:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
            application/vnd.scival.v2+xml:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
        '400':
          description: No entities specified
        '401':
          description: Request not authorized
        '500':
          description: Unknown error encountered
      tags:
      - SciVal Topic Lookup API
      operationId: topicMetrics
      summary: Get topic metrics by id(s)
  /topic/metrics/countryId/{countryId}:
    get:
      parameters:
      - description: SciVal country id to filter on
        in: path
        name: countryId
        required: true
        schema:
          type: integer
          format: int64
      - description: Topic id to return metrics for
        in: query
        name: topicId
        required: true
        x-example: 1026
        schema:
          type: integer
          format: int64
      - description: Types of the desired metrics
        in: query
        name: metricTypes
        schema:
          type: string
          enum:
          - CitationCount
          - ScholarlyOutput
          - FieldWeightedCitationImpact
          - PublicationShare
          - PublicationShareGrowth
      - description: Year range of returned metric (see response values for metricStartYear and metricEndYear for actual years)
        in: query
        name: yearRange
        schema:
          type: string
          enum:
          - 3yrs
          - 3yrsAndCurrent
          - 3yrsAndCurrentAndFuture
          - 5yrs
          - 5yrsAndCurrent
          - 5yrsAndCurrentAndFuture
          - 10yrs
          default: 5yrs
      - description: Your API key
        in: query
        name: apiKey
        required: true
        schema:
          type: string
          default: 7f59af901d2d86f78a1fd60c1bf9426a
      - description: Specification for authorization, institution authtoken
        in: query
        name: insttoken
        required: false
        schema:
          type: string
      - description: Specification for active session, secured authtoken
        in: query
        name: access_token
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
            application/vnd.scival.v2+json:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
            application/vnd.scival.v2+xml:
              schema:
                $ref: '#/components/schemas/TopicMetricResponse'
        '401':
          description: Request not authorized
        '404':
          description: Country not found
        '500':
          description: Unknown error encountered
      tags:
      - SciVal Topic Lookup API
      operationId: countryTopicMetrics
      summary: Get topic metrics by SciVal country id
