        RESULTS-PER-PAGE:
          type: integer
          format: int32
    DocID:
      properties:
        DB:
          $ref: '#/components/schemas/Database'
        DOC-ID:
          type: string
        HITINDEX:
          type: integer
          format: int32
        TAGDATE:
          type: string
    PageContainer:
      properties:
        PAGE:
          $ref: '#/components/schemas/PageContainerItems'
    ContributorAffiliation:
      properties:
        AFID:
          type: array
