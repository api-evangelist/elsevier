providerId: elsevier
description: >-
  Elsevier publishes no price list for the Research Products APIs. Access is not sold in
  tiers; it is granted by WHO YOU ARE and WHAT YOUR INSTITUTION ALREADY SUBSCRIBES TO. The
  three access classes below are the provider's own words, and none of them carries a
  published number. This artifact records that as the finding rather than omitting the file:
  a developer cannot learn from Elsevier's site what any of this costs.
pricing_model: entitlement-based
public_price_list: false
currency: null
plans:
- id: elsevier-non-commercial
  name: Non-commercial (academic and public-sector)
  type: free
  price: '0.00'
  currency: null
  billing_period: null
  audience: >-
    Researchers in academic and public-sector institutions, charities and charitable
    foundations.
  description: >-
    "Most APIs (except SciVal APIs) are available for no charge, for non-commercial use,
    subject to Elsevier's policies and limits on usage." Quoted verbatim from the developer
    portal FAQ.
  self_serve: true
  signup: https://dev.elsevier.com/apikey/manage
  included_quota: see rate-limits/elsevier-rate-limits.yml
  quota_note: >-
    Quotas are per API, not per plan — the same free key gets 20,000 weekly Scopus Search
    requests and 5,000 weekly Author Search requests. There is no single global allowance.
  entitlement_gate: >-
    Content returned is bounded by the caller's institutional subscription, resolved by
    institutional IP address. Calling from outside the institutional network without an
    Institutional Token returns authorisation errors even with a valid key.
  excluded:
  - SciVal APIs
  - the eight access-controlled APIs listed in rate-limits/elsevier-rate-limits.yml
