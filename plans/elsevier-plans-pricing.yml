gates:
- name: Access-controlled APIs
  description: >-
    Eight APIs are not enabled on a new key at all and require a written request reviewed by
    Elsevier API Support, which states it "cannot guarantee permission to use access-controlled
    APIs."
  url: https://dev.elsevier.com/api_key_settings.html
- name: Use-case policy
  description: >-
    Even inside the free tier, permitted uses are enumerated (federated search, IR/CRIS/VIVO,
    cited-by, journal metrics, academic research, text mining, SciVal metrics). A use case not
    on the list must be cleared with Elsevier before it is allowed.
  url: https://dev.elsevier.com/policy.html
