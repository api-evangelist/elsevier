provider: Elsevier
limit_count: 36
providerId: elsevier
description: Per-API weekly quotas and per-second throttles for the Elsevier Research Products APIs, transcribed
  from the provider's own Default API Key Settings table. Elsevier states plainly that "Quota limits are
  unique to each API, there is not a single global setting for a given APIKey" — so these are per-API-key,
  per-API limits, not tiers.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  reset_format: Unix timestamp (seconds)
  status: X-ELS-Status
  request_id: X-ELS-ReqId
  retryAfter: null
  policy: null
  note: 'X-RateLimit-Limit / -Remaining / -Reset are returned on successful responses. Elsevier documents
    that once the weekly quota is exhausted those two counters STOP being returned and the response instead
    carries X-ELS-Status: QUOTA_EXCEEDED alongside X-RateLimit-Reset — so an agent cannot rely on Remaining
    trending to zero as its exhaustion signal. No Retry-After and no RFC 9238 RateLimit-Policy header
    is emitted.'
responseCodes:
  throttled: 429
  quotaExceeded: 429
  note: Both exhaustion modes return the same status. They are distinguished only by whether X-ELS-Status
    is QUOTA_EXCEEDED (weekly quota) or the X-RateLimit-* counters are still present (per-second throttle).
quota_increase:
  available: true
  process: email API Support with the API key, full institution name, a description of the use case, the
    API name, and the requested quota
  url: https://service.elsevier.com/app/contact/supporthub/researchproductsapis/
  self_serve: false
access_controlled_apis:
  note: Access to these APIs is not enabled on a new key by default and requires review by Elsevier API
    Support, which explicitly "cannot guarantee permission".
  apis:
  - Scopus Citation Overview
  - Scopus Author Feedback
  - ScienceDirect Full-Text Entitlement
  - ScienceDirect Article Hosting Permissions
  - ScienceDirect Holdings Report
  - Embase Search and Retrieval
  - Engineering Village Search and Retrieval
  - SUSHI COP5 API
