          items:
            $ref: '#/components/schemas/Affiliation'
    Eds:
      properties:
        ED:
          type: array
          description: Editor list
          items:
            $ref: '#/components/schemas/ContributorInfo'
    PageResults:
      properties:
        PAGE-ENTRY:
          type: array
          items:
            $ref: '#/components/schemas/PageEntry'
    CitationEiDoc:
      properties:
        AFS:
          description: Authors affiliation
          $ref: '#/components/schemas/Afs'
        AUS:
          description: Authors
          $ref: '#/components/schemas/Aus'
        DOC:
          $ref: '#/components/schemas/DocID'
        DOCUMENTPROPERTIES:
          type: object
          additionalProperties:
            type: string
        EDS:
