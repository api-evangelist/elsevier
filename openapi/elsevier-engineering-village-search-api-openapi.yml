          $ref: '#/components/schemas/Eds'
        EFS:
          description: Editors affiliation
          $ref: '#/components/schemas/Efs'
        FT:
          $ref: '#/components/schemas/FT'
        VIEW:
          type: string
        docProperties:
          $ref: '#/components/schemas/DocProperties'
    ContributorInfo:
      properties:
        AFS:
          description: Affiliations
          $ref: '#/components/schemas/ContributorAffiliation'
        CO:
          type: string
