- from: Document
  to: Citation
  type: has_one
  via: citedby-count / scopus_id
- from: Document
  to: Entitlement
  type: has_one
  via: the same identifier, on the entitlement path
- from: Author
  to: Affiliation
  type: has_many
  via: affiliation-current / affiliation-history
- from: Author
  to: Document
  type: has_many
  via: author_id in Scopus Search
- from: Affiliation
  to: Affiliation
  type: has_many
  via: institution hierarchy (EID prefix 34 parents over prefix 10 children)
- from: TopicCluster
  to: Topic
  type: has_many
  via: topicClusterId
- from: Topic
  to: ScopusSource
  type: has_many
  via: scopusSourceId
- from: Affiliation
  to: Topic
  type: has_many
  via: /topic/institutionId/{institutionId}
- from: Country
  to: Affiliation
  type: has_many
  via: /institution/countryId/{countryId}
- from: CountryGroup
  to: Country
  type: has_many
  via: /institution/countryGroupId/{countryGroupId}
- from: ScopusSource
  to: SerialTitle
  type: has_one
  via: issn
  note: >-
    The same venue is modelled twice — as a SciVal ScopusSource with metrics and as a content
    SerialTitle with coverage and cover images. There is no single canonical venue object.
