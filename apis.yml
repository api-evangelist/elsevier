- aid: elsevier:elsevier-sushi-api
  name: Elsevier COUNTER SUSHI API
  description: >-
    Elsevier's COUNTER Code of Practice Release 5 and 5.1 API, delivering standards-compliant usage statistics
    and reports over SUSHI. Base https://api.elsevier.com/sushi/ for COP5 and https://api.elsevier.com/sushi/r51/
