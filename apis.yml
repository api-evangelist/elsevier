- aid: elsevier:elsevier-sushi-api
  name: Elsevier COUNTER SUSHI API
  description: >-
    Elsevier's COUNTER Code of Practice Release 5 and 5.1 API, delivering standards-compliant usage
    statistics and reports over SUSHI. Base https://api.elsevier.com/sushi/ for COP5 and
    https://api.elsevier.com/sushi/r51/ for COP5.1, with /status, /members and /reports endpoints.
    Access requires a COUNTER requestor ID and a preconfigured key issued by Elsevier support.
  humanURL: https://dev.elsevier.com/sushicop5.html
  baseURL: https://api.elsevier.com/sushi
  tags:
  - COUNTER
