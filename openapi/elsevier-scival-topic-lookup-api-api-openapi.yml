  /topic/{id}:
    get:
      parameters:
      - description: Id of requested topic
        in: path
        name: id
        required: true
        x-example: 17340
        schema:
          type: integer
          format: int64
      - description: Your API key
        in: query
        name: apiKey
        required: true
        schema:
          type: string
          default: 7f59af901d2d86f78a1fd60c1bf9426a
      - description: Specification for authorization, institution authtoken
