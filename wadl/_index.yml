description: Elsevier's real machine-readable contract set. 37 WADL documents describing 149 resources
  and 138 methods across the whole Research Products surface — every product, including the ones the Swagger
  consoles never cover (Embase, SUSHI COUNTER, PlumX, Holdings, Feedback, Authentication). Every file
  here was fetched verbatim from https://api.elsevier.com/documentation/<Name>.wadl and saved byte-for-byte.
discovery_note: The developer portal links these as https://dev.elsevier.com/documentation/<Name>.wadl,
  which serves an HTML RENDERING of the contract, not the contract. The machine-readable XML is on the
  API host at https://api.elsevier.com/documentation/<Name>.wadl. Any crawler that took the linked URL
  at face value would conclude Elsevier publishes no machine-readable contract at all; that is why this
  repository previously carried only an eight-operation hand-built stand-in.
encoding_defect: The provider serves these as Content-Type application/xml;charset=ISO-8859-1 while the
  XML declaration is <?xml version="1.0"?> with no encoding attribute, which XML requires to be read as
  UTF-8. Several files therefore contain bytes that are not well-formed UTF-8 and will fail a strict parser.
  Saved verbatim regardless — the defect is Elsevier's and should be visible.
